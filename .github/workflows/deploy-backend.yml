name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'leads-crm-backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'leads-crm-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: 'sales-growth-project-501903'
  SERVICE: 'crm-backend'
  REGION: 'asia-south2'

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'leads-crm-backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r leads-crm-backend/requirements.txt

      - name: Run Tests
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_ANON_KEY: "mock-anon-key"
        run: |
          PYTHONPATH=leads-crm-backend pytest leads-crm-backend/tests/ -v

  deploy:
    name: Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          source: './leads-crm-backend'
          flags: '--allow-unauthenticated'
          env_vars: |
            ENVIRONMENT=production
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            ALLOWED_ORIGINS="http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,https://crm.workfloww.ai,https://crm-git-main-workfloww.vercel.app,https://flowwies.workfloww.ai,https://hrms.workfloww.ai"
            ALLOWED_ORIGIN_REGEX="^https://([a-zA-Z0-9-]+\.)*workfloww\.ai$"
